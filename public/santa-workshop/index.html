<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Xưởng Quà Của Ông Già Noel — Usagi Activity</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./vendor/phaser.min.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Top HUD -->
      <header class="hud-header">
        <div class="player-badge">
          <div id="avatar-wrapper" class="avatar-wrapper">
            <img id="player-avatar" src="" alt="Elf" class="avatar-img hidden" />
            <div id="player-avatar-fallback" class="avatar-fallback">🧝</div>
          </div>
          <div class="player-meta">
            <div id="player-name" class="player-name">Yêu Tinh Noel</div>
            <div id="workshop-level" class="workshop-level">Xưởng Cấp 1</div>
          </div>
        </div>

        <div class="header-right">
          <div class="audio-controls">
            <button id="btn-song" class="pill btn-pill" title="Đổi nhạc Giáng Sinh">
              <span>🎵</span>
              <span id="song-name" class="song-name">We Wish You...</span>
            </button>
            <button id="btn-mute" class="pill btn-pill" title="Bật / Tắt âm thanh">🔊</button>
          </div>

          <div class="currency-bar">
            <div class="pill coin-pill" title="Xu Tuyết">
              <span>❄️</span>
              <strong id="snow-coins">0</strong>
            </div>
            <div class="pill rep-pill" title="Điểm Danh Vọng">
              <span>⭐</span>
              <strong id="reputation">0</strong>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Workspace (PC: 2 columns, Mobile: stacked) -->
      <div class="workspace-layout">
        <!-- Phaser 3 Canvas Area -->
        <main class="stage-container">
          <div id="phaser-root"></div>

          <!-- Fever & Combo Bar -->
          <div class="fever-hud">
            <div class="fever-label">
              <span>🔥 Mưa Quà Fever</span>
              <span id="combo-badge" class="combo-badge hidden">Combo x1</span>
            </div>
            <div class="fever-track">
              <div id="fever-fill" class="fever-fill" style="width: 0%"></div>
            </div>
          </div>

          <!-- Floating Toast -->
          <div id="toast" class="toast hidden"></div>

          <!-- Mobile Collapse Toggle -->
          <button id="btn-toggle-panel" class="toggle-panel-btn" title="Thu gọn / Mở rộng bảng">
            ▾ Thu gọn
          </button>
        </main>

        <!-- Control Panel -->
        <section id="panel-overlay" class="panel-overlay">
          <div id="panel-content" class="panel-content"></div>
        </section>
      </div>

      <!-- Lucky Wheel Modal -->
      <div id="wheel-modal" class="modal-backdrop hidden">
        <div class="modal-card">
          <div class="modal-header">
            <strong>🎡 Vòng Quay May Mắn Giáng Sinh</strong>
            <button id="btn-close-wheel" class="btn btn-outline btn-sm">✕</button>
          </div>
          <div class="wheel-stage">
            <div class="wheel-pointer">▼</div>
            <canvas id="wheel-canvas" width="280" height="280"></canvas>
          </div>
          <div id="wheel-result" class="wheel-result">Nhấn nút để thử vận may đêm Noel!</div>
          <button id="btn-spin-now" class="btn btn-gold" style="width: 100%">
            🎡 Quay Ngay (<span id="wheel-tickets-count">0</span> 🎟️)
          </button>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" aria-label="Menu trò chơi">
        <button class="nav-btn active" data-tab="workshop">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Xưởng</span>
        </button>
        <button class="nav-btn" data-tab="craft">
          <span class="nav-icon">🔨</span>
          <span class="nav-label">Chế tạo</span>
        </button>
        <button class="nav-btn" data-tab="orders">
          <span class="nav-icon">🛷</span>
          <span class="nav-label">Đơn hàng</span>
        </button>
        <button class="nav-btn" data-tab="quests">
          <span class="nav-icon">🎁</span>
          <span class="nav-label">Nhiệm vụ</span>
        </button>
        <button class="nav-btn" data-tab="shop">
          <span class="nav-icon">🛒</span>
          <span class="nav-label">Shop</span>
        </button>
      </nav>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
