server:
  # Dùng LAVALINK_PORT riêng để tránh đụng PORT của web server bot.
  port: ${LAVALINK_PORT:2333}
  address: ${LAVALINK_ADDRESS:0.0.0.0}

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      snapshot: false

  server:
    # Phải trùng với password trong node Lavalink mà bot kết nối.
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    sources:
      # Tắt source YouTube mặc định để dùng youtube-plugin bên dưới.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      nico: false
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - WEB
