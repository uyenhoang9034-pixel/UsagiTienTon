services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_URL: ""
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: usagitienton
      POSTGRES_USER: usagitienton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSL: "false"
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
      LAVALINK_SECURE: "false"
      PORT: 3000
    ports:
      - "${PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_started
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: usagitienton
      POSTGRES_USER: usagitienton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - usagi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usagitienton -d usagitienton"]
      interval: 10s
      timeout: 5s
      retries: 5
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?Set LAVALINK_PASSWORD in .env}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
volumes:
  usagi_postgres_data:
